apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: {{ printf "jdbc:mysql://%s:%v/%s?serverTimezone=Asia/Seoul" .Values.db.host .Values.db.port .Values.db.name | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.db.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.db.password | quote }}
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
