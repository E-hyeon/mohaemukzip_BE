{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: {{ .Values.serviceMonitor.interval }}
      relabelings:
        # 대시보드 쿼리가 쓰는 application 라벨 (compose 의 prometheus 설정과 동일한 값)
        - action: replace
          targetLabel: application
          replacement: mohaemukzip_BE
{{- end }}
